<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login Portal SMK Negeri 3 Metro.">
  <title>Login - SMKN 3 Metro</title>
  <link rel="icon" href="https://www.smkn3metro.sch.id/storage/uploads/2025/05/6816545e702a7.webp" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-dark">

  <section class="login-section d-flex align-items-center justify-content-center position-relative w-100" style="background: linear-gradient(135deg, rgba(15,31,58,0.92), rgba(42,82,152,0.85)), url('https://images.unsplash.com/photo-1562774053-701939374585?w=1920&q=80') center/cover no-repeat;">
    
    <div class="container position-relative z-1">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-8 col-sm-10">
          
          <div class="card bg-white bg-opacity-10 border-white border-opacity-10 text-white shadow-lg overflow-hidden" style="backdrop-filter: blur(15px); border-radius: 1.5rem;">
            <div class="card-body p-4 p-md-5">
              
              <div class="text-center mb-4">
                <img src="https://www.smkn3metro.sch.id/storage/uploads/2025/05/6816545e702a7.webp" alt="Logo" width="70" class="mb-3 drop-shadow">
                <h3 class="fw-bold mb-1">Selamat Datang</h3>
                <p class="text-white-50 small">Masuk ke Portal SMKN 3 Metro</p>
              </div>

              <form id="loginForm">
                <div class="mb-3">
                  <label class="form-label small fw-semibold text-white-50" for="loginUsername">Username / NIS / NIP</label>
                  <div class="input-group">
                    <span class="input-group-text bg-dark bg-opacity-50 text-white-50 border-secondary"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control bg-dark bg-opacity-50 text-white border-secondary" id="loginUsername" placeholder="Masukkan username" required>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-semibold text-white-50" for="loginPassword">Password</label>
                  <div class="input-group">
                    <span class="input-group-text bg-dark bg-opacity-50 text-white-50 border-secondary"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control bg-dark bg-opacity-50 text-white border-secondary border-end-0" id="loginPassword" placeholder="Masukkan password" required>
                    <button class="btn btn-outline-secondary bg-dark bg-opacity-50 border-secondary border-start-0 text-white-50" type="button" id="togglePassword">
                      <i class="fas fa-eye"></i>
                    </button>
                  </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                  <div class="form-check">
                    <input class="form-check-input bg-dark border-secondary" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-white-50 small" for="rememberMe">Ingat Saya</label>
                  </div>
                  <a href="#" class="text-warning text-decoration-none small fw-semibold">Lupa Password?</a>
                </div>

                <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mb-4">
                  <i class="fas fa-sign-in-alt me-2"></i>Masuk
                </button>
              </form>

              <div class="text-center pt-3 border-top border-white border-opacity-10">
                <p class="text-white-50 small mb-2">Login sebagai:</p>
                <div class="d-flex justify-content-center gap-2 flex-wrap mb-4">
                  <span class="badge border border-white border-opacity-25 bg-white bg-opacity-10 text-white-50 px-3 py-2 fw-normal"><i class="fas fa-user-graduate me-1 text-warning"></i> Siswa</span>
                  <span class="badge border border-white border-opacity-25 bg-white bg-opacity-10 text-white-50 px-3 py-2 fw-normal"><i class="fas fa-chalkboard-teacher me-1 text-success"></i> Guru</span>
                  <span class="badge border border-white border-opacity-25 bg-white bg-opacity-10 text-white-50 px-3 py-2 fw-normal"><i class="fas fa-user-shield me-1 text-info"></i> Admin</span>
                </div>
                <a href="index.html" class="text-white-50 text-decoration-none small hover-warning">
                  <i class="fas fa-arrow-left me-1"></i> Kembali ke Beranda
                </a>
              </div>

            </div>
          </div>

        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
